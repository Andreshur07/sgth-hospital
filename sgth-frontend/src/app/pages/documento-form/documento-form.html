<div class="form-page">
  <div class="page-header">
    <div>
      <h1>{{ modoEdicion ? 'Editar Documento' : 'Nuevo Documento' }}</h1>
      <p>Registro y control de documentos asociados a funcionarios</p>
    </div>
  </div>

  @if (mensajeExito) {
  <div class="alert-success">
    ✅ {{ mensajeExito }}
  </div>
  }

  @if (mensajeError) {
  <div class="alert-error">
    ❌ {{ mensajeError }}
  </div>
  }

  <form class="form-card">
    <h2>Datos del documento</h2>

    <div class="form-grid">
      <div class="form-group">
        <label>Funcionario</label>
        <select [(ngModel)]="documento.funcionario" name="funcionario">
          <option [ngValue]="null">Seleccione...</option>
          <option *ngFor="let funcionario of funcionarios" [ngValue]="funcionario">
            {{ funcionario.primerNombre }} {{ funcionario.segundoNombre }}
            {{ funcionario.primerApellido }} {{ funcionario.segundoApellido }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Tipo Documento</label>
        <select [(ngModel)]="documento.tipoDocumento" name="tipoDocumento">
          <option [ngValue]="null">Seleccione...</option>
          <option *ngFor="let tipo of tiposDocumento" [ngValue]="tipo">
            {{ tipo.nombre }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label>Nombre Archivo</label>
        <input type="text" [(ngModel)]="documento.nombreArchivo" name="nombreArchivo"
          placeholder="Ej: cedula_andres.pdf">
      </div>

      <div class="form-group">
        <label>Ubicación / Referencia del archivo</label>
        <input type="text" [(ngModel)]="documento.rutaArchivo" name="rutaArchivo"
          placeholder="Ej: Carpeta física, ruta digital o referencia del archivo">
      </div>

      <div class="form-group">
        <label>Fecha Expedición</label>
        <input type="date" [(ngModel)]="documento.fechaExpedicion" name="fechaExpedicion">
      </div>

      <div class="form-group">
        <label>Fecha Vencimiento</label>
        <input type="date" [(ngModel)]="documento.fechaVencimiento" name="fechaVencimiento">
      </div>

      <div class="form-group">
        <label>Estado</label>
        <select [(ngModel)]="documento.estado" name="estado">
          <option value="VIGENTE">VIGENTE</option>
          <option value="VENCIDO">VENCIDO</option>
          <option value="INACTIVO">INACTIVO</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label>Observación</label>
        <textarea [(ngModel)]="documento.observacion" name="observacion"
          placeholder="Observaciones del documento"></textarea>
      </div>
    </div>

    <div class="actions">
      <button type="button" class="btn-cancel" (click)="cancelar()">
        Cancelar
      </button>

      <button type="button" class="btn-save" (click)="guardar()">
        {{ modoEdicion ? 'Actualizar Documento' : 'Guardar Documento' }}
      </button>
    </div>
  </form>
</div>
